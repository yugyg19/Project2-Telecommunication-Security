services:
  django:
    build:
      context: ./app
    image: telecom-lab-django:p2
    container_name: project2-django
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    volumes:
      - django-data:/data
    networks:
      app-net:
        ipv4_address: 10.20.8.20
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    build:
      context: ./nginx
    image: telecom-lab-nginx:p2
    container_name: project2-nginx
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
    networks:
      app-net:
        ipv4_address: 10.20.8.10
      dn-net:
        ipv4_address: 10.20.6.20

networks:
  app-net:
    name: project2-app-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.8.0/24

  dn-net:
    name: project1-n6
    external: true

volumes:
  django-data:
    name: project2-django-data
